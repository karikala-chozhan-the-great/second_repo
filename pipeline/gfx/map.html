<!doctype html><meta charset=utf-8><link rel=stylesheet href=common.css>
<style>
body{background:radial-gradient(ellipse at 50% 50%,#17171c 0%,#08080a 75%)}
svg{position:absolute;inset:0}
.neigh{fill:#1c1c22;stroke:#2c2c35;stroke-width:.8}
.rep{stroke:#0d0d0f;stroke-width:1.2}
.foc{stroke:#0d0d0f;stroke-width:1.4}
#hdr{position:absolute;left:90px;top:60px}
#hdr .k{font-size:34px;color:#cfc7b8;letter-spacing:2px;text-transform:uppercase}
.ta #hdr .k{text-transform:none;letter-spacing:1px}
#hdr .n{font-size:150px;font-weight:800;color:var(--gold);line-height:150px;height:150px;font-variant-numeric:tabular-nums;font-family:'Noto Sans',sans-serif}
#tick{position:absolute;left:90px;bottom:90px;width:900px}
#tick .nm{font-size:76px;font-weight:700;line-height:1.2}
#tick .dt{font-size:44px;color:var(--gold);margin-top:6px}
#stats{position:absolute;right:90px;top:90px;width:700px}
.st{margin-bottom:34px;border-left:8px solid var(--red);padding-left:26px;opacity:0}
.st .v{font-size:120px;font-weight:800;color:var(--gold);line-height:1;font-family:'Noto Sans',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.st .u{font-size:54px;font-weight:700;margin-left:12px;color:var(--ink)}
.st .l{font-size:40px;color:var(--ink);margin-top:6px}
#ttl{position:absolute;right:90px;bottom:90px;font-size:48px;font-weight:700;text-align:right;max-width:700px;line-height:1.2}
.lab{font-size:34px;font-weight:600;fill:#f4efe6;paint-order:stroke;stroke:#000;stroke-width:6px;stroke-linejoin:round}
</style>
<svg id=s viewBox="0 0 1920 1080"><g id=g></g><g id=ov></g></svg>
<div id=ttl></div><div id=stats></div><div id=hdr><div class=k id=cap></div><div class=n id=num></div></div><div id=tick><div class=nm id=nm></div><div class=dt id=dt></div></div>
<script>
const D=window.__DATA||{};if(D.lang==='ta')document.body.classList.add('ta');
window.__ready=false;let M,els={},focEl=[],arrows=[],paints=[],chain=null,texts=[],ORDER=D.order||[],ST=D.stats||[],stEl=[];
const NS='http://www.w3.org/2000/svg',g=document.getElementById('g'),ov=document.getElementById('ov');
const e=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3),clamp=x=>Math.min(1,Math.max(0,x));
function mix(a,b,p){const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=h(a),B=h(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('')}
function mk(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);(parent||g).appendChild(el);return el}
function init(){
  const F=D.focus;const focNames=F?F.names:[];
  Object.entries(M.named).forEach(([k,d])=>{if(!focNames.includes(k))mk('path',{d,class:'neigh'})});
  Object.entries(M.rep).forEach(([k,v])=>{els[k]=mk('path',{d:v.d,class:'rep',fill:D.repcol||'#a30d25'})});
  focNames.forEach(k=>{focEl.push(mk('path',{d:M.named[k]||(M.rep[k]&&M.rep[k].d),class:'foc',fill:'#3a3a44'}))});
  if(F){(F.arrows||[]).forEach(a=>{const p=M.pts[a.from],q=M.pts[a.to];const mx=(p[0]+q[0])/2+(a.bend||0),my=(p[1]+q[1])/2;
      const d=`M${p[0]},${p[1]} Q${mx},${my} ${q[0]},${q[1]}`;const path=mk('path',{d,fill:'none',stroke:F.arrowcol||'#ffd84a','stroke-width':9,'stroke-linecap':'round'},ov);
      const L=path.getTotalLength();path.setAttribute('stroke-dasharray',L);path.setAttribute('stroke-dashoffset',L);
      const head=mk('circle',{r:13,fill:F.arrowcol||'#ffd84a',opacity:0},ov);arrows.push({path,L,head,a,t:a.t});
    });
    (F.labels||[]).forEach(l=>{const p=M.pts[l.at];const t=mk('text',{x:p[0]+(l.dx||0),y:p[1]+(l.dy||0),class:'lab','text-anchor':l.anchor||'start',opacity:0},ov);t.textContent=l.text;l.el=t;l.dot=mk('circle',{cx:p[0],cy:p[1],r:9,fill:'#fff',opacity:0},ov)});
  }
  (D.done||[]).forEach(o=>{if(els[o.k])els[o.k].setAttribute('fill',o.col)});
  // timed repaint of any country (republic or neighbour): paint=[{k,col,t,from?}]
  (D.paint||[]).forEach(o=>{let el=els[o.k];if(!el){const d=M.named[o.k]||(M.rep[o.k]&&M.rep[o.k].d);if(!d)return;el=mk('path',{d,class:'foc',fill:'#1c1c22'});o.base='#1c1c22'}paints.push({o,el})});
  // a chain of people along a route through named points
  if(D.chain){const C=D.chain,pts=C.pts.map(k=>M.pts[k]);const dd='M'+pts.map(q=>q[0]+','+q[1]).join(' L');const base=mk('path',{d:dd,fill:'none',stroke:'rgba(255,255,255,.18)','stroke-width':4},ov);
    const tmp=mk('path',{d:dd,fill:'none'},ov);const L=tmp.getTotalLength(),n=C.n||110;chain=[];
    for(let i=0;i<n;i++){const q=tmp.getPointAtLength(L*i/(n-1));chain.push(mk('circle',{cx:q.x,cy:q.y,r:C.r||10,fill:C.col||'#ffd84a',stroke:'#0d0d0f','stroke-width':3,opacity:0},ov))}}
  // free text labels at named points / country centres: texts=[{at|cent,text,t,dx,dy,anchor,size,dot}]
  (D.texts||[]).forEach(l=>{const p=l.cent?M.cent[l.cent]:M.pts[l.at];if(!p)return;const t=mk('text',{x:p[0]+(l.dx||0),y:p[1]+(l.dy||0),class:'lab','text-anchor':l.anchor||'middle',opacity:0,style:l.size?`font-size:${l.size}px`:''},ov);t.textContent=l.text;
    const dot=l.dot?mk('circle',{cx:p[0],cy:p[1],r:9,fill:'#fff',stroke:'#0d0d0f','stroke-width':3,opacity:0},ov):null;texts.push({l,t,dot})});
  document.getElementById('cap').textContent=D.caption||'';document.getElementById('ttl').textContent=D.title||'';if(D.ttlsize)document.getElementById('ttl').style.cssText+=`font-size:${D.ttlsize}px;font-weight:500;color:#cfc7b8`;
  ST.forEach(o=>{const d=document.createElement('div');d.className='st';d.innerHTML=`<div class=v></div><div class=l>${o.label}</div>`;document.getElementById('stats').appendChild(d);stEl.push(d)});
  window.__ready=true;
}
const s=document.createElement('script');s.src=D.mapfile||'map_data_full.js';s.onload=()=>{M=window.MAP;init()};document.head.appendChild(s);
const T0=D.t0||1.0,STEP=D.step||0.6;
window.setT=t=>{
  if(!M)return;
  const F=D.focus;
  ST.forEach((o,i)=>{const p=e((t-o.t)/.8),el=stEl[i];el.style.opacity=p;el.style.transform=`translateX(${(1-p)*40}px)`;
    el.querySelector('.v').innerHTML=(o.pre||'')+Math.round(o.v*p).toLocaleString('en-US')+(o.suf?`<span class=u>${o.suf.trim()}</span>`:'')});
  paints.forEach(({o,el})=>{const p=e((t-o.t)/.7);if(t>=o.t||el.getAttribute('data-p')){el.setAttribute('fill',mix(o.from||o.base||D.repcol||'#a30d25',o.col,p));el.setAttribute('data-p','1')}});
  if(chain){const C=D.chain,p=e((t-(C.t||1))/(C.dur||4));chain.forEach((c,i)=>c.setAttribute('opacity',(i/(chain.length-1))<=p?1:0))}
  texts.forEach(({l,t:te,dot})=>{const a=e((t-l.t)/.5);te.setAttribute('opacity',a);if(dot)dot.setAttribute('opacity',a)});
  // breakaway
  let left=D.startCount||15;const evs=ORDER.filter(o=>!o.stay);
  ORDER.forEach((o,i)=>{const el=els[o.k];if(!el)return;const ts=T0+evs.indexOf(o)*STEP,p=(t-ts)/0.5;
    if(o.stay){el.setAttribute('fill',mix(D.repcol||'#a30d25',o.col||'#c8102e',e((t-T0)/1)));return}
    if(p<0){return}left--;
    el.setAttribute('fill',p<.35?mix(D.repcol||'#a30d25','#ffd84a',p/.35):mix('#ffd84a',o.col,clamp((p-.35)/.65)))});
  if(ORDER.length){document.getElementById('num').textContent=Math.max(1,left)}else if(D.counter!==undefined){document.getElementById('num').textContent=D.counter}
  const idx=Math.min(evs.length-1,Math.floor((t-T0)/STEP)),ev=evs[Math.max(0,idx)],tk=document.getElementById('tick');
  if(D.note){document.getElementById('nm').textContent=D.note.name;document.getElementById('dt').textContent=D.note.date||'';tk.style.opacity=e((t-(D.note.t||0.5))/.6)}
  else if(F&&F.title){document.getElementById('nm').textContent=F.title;document.getElementById('dt').textContent=F.sub||'';tk.style.opacity=e((t-(F.t0||0.5))/.6)}
  else if(t>=T0&&ev){document.getElementById('nm').textContent=ev.label;document.getElementById('dt').textContent=ev.date;tk.style.opacity=e((t-T0-Math.max(0,idx)*STEP)/.3)}else tk.style.opacity=0;
  // focus country pulse + arrows
  if(F){const p=e((t-(F.t0||0.5))/.8),pulse=0.5+0.5*Math.sin(t*3);
    focEl.forEach(el=>el.setAttribute('fill',mix('#3a3a44',F.col||'#e3c23a',p*(0.78+0.22*pulse))));
    arrows.forEach(o=>{const q=clamp((t-o.t)/(o.a.dur||1.6));o.path.setAttribute('stroke-dashoffset',o.L*(1-e(q)));
      const pt=o.path.getPointAtLength(o.L*e(q));o.head.setAttribute('cx',pt.x);o.head.setAttribute('cy',pt.y);o.head.setAttribute('opacity',q>0?1:0)});
    (F.labels||[]).forEach(l=>{const a=e((t-l.t)/.5);l.el.setAttribute('opacity',a);l.dot.setAttribute('opacity',a)});
  }
  document.body.style.opacity=D.dur&&t>D.dur-.5?e((D.dur-t)/.5):1;
};
</script>
