<!doctype html><meta charset=utf-8><link rel=stylesheet href=common.css>
<style>
#shade{position:absolute;left:0;right:0;bottom:0;height:330px;background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,0));opacity:0}
#stamp{position:absolute;left:90px;bottom:80px;font-size:38px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);padding-left:22px;border-left:8px solid var(--red);text-shadow:0 2px 8px #000;opacity:0}
.ta #stamp{text-transform:none;letter-spacing:1px}
#stamp .l2{color:var(--gold);font-size:30px;margin-top:4px}
#chip{position:absolute;right:90px;bottom:80px;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:#d8d0c0;background:rgba(0,0,0,.5);border:2px solid rgba(216,208,192,.55);padding:8px 18px;opacity:0}
.ta #chip{text-transform:none;letter-spacing:1px}
#lt{position:absolute;left:90px;bottom:80px;display:flex;overflow:hidden;opacity:0}
#lt .bar{width:10px;background:var(--red)}
#lt .box{background:linear-gradient(90deg,rgba(10,10,12,.9),rgba(10,10,12,.75));padding:18px 36px 20px 28px}
#lt .nm{font-size:58px;font-weight:700;white-space:nowrap}#lt .rl{font-size:34px;color:var(--gold);margin-top:4px;white-space:nowrap}
</style>
<div id=shade></div><div id=chip></div><div id=stamp><div class=l1></div><div class=l2></div></div>
<div id=lt><div class=bar></div><div class=box><div class=nm></div><div class=rl></div></div></div>
<script>
const D=window.__DATA||{};if(D.lang==='ta')document.body.classList.add('ta');
const E=x=>Math.min(1,Math.max(0,x)),o3=x=>1-Math.pow(1-E(x),3);
const chip=document.getElementById('chip');if(D.chip)chip.textContent=D.chip;
const st=document.getElementById('stamp'),lt=document.getElementById('lt'),sh=document.getElementById('shade');
if(D.stamp){st.querySelector('.l1').textContent=D.stamp.l1||'';st.querySelector('.l2').textContent=D.stamp.l2||''}
if(D.lower){lt.querySelector('.nm').textContent=D.lower.name;lt.querySelector('.rl').textContent=D.lower.role}
window.setT=t=>{
  let any=0;
  if(D.stamp){const a=o3((t-D.stamp.t0)/.5)*(1-o3((t-D.stamp.t1)/.5));st.style.opacity=a;st.style.transform=`translateX(${(1-o3((t-D.stamp.t0)/.5))*-30}px)`;any=Math.max(any,a)}
  if(D.lower){const a=o3((t-D.lower.t0)/.6)*(1-o3((t-D.lower.t1)/.6));lt.style.clipPath=`inset(0 ${(1-a)*100}% 0 0)`;lt.style.opacity=a>0?1:0;any=Math.max(any,a)}
  if(D.chip){chip.style.opacity=o3((t-0.6)/.5)*(1-o3((t-((D.dur||9)-0.4))/.4))}
  sh.style.opacity=any;
};
</script>
