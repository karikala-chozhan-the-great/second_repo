<!doctype html><meta charset=utf-8><link rel=stylesheet href=common.css>
<style>
body{background:radial-gradient(ellipse at 50% 48%,#1a0a0d 0%,#050506 72%)}
#d{position:absolute;left:0;right:0;top:330px;text-align:center;font-size:150px;font-weight:800;letter-spacing:6px;color:var(--gold);font-family:'Noto Sans','Noto Sans Tamil',sans-serif;line-height:180px;height:180px;white-space:nowrap}
.ta #d{font-size:128px;letter-spacing:2px}
#line{position:absolute;left:50%;top:560px;height:6px;background:var(--red);transform:translateX(-50%)}
#p{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:76px;font-weight:600;letter-spacing:10px;text-transform:uppercase;line-height:100px}
.ta #p{text-transform:none;letter-spacing:4px}
#grain{position:absolute;inset:0;opacity:.07;background-image:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
</style>
<div id=d></div><div id=line></div><div id=p></div><div id=grain></div>
<script>
const D=window.__DATA||{};if(D.lang==='ta')document.body.classList.add('ta');
const E=x=>Math.min(1,Math.max(0,x)),o3=x=>1-Math.pow(1-E(x),3);
document.getElementById('d').textContent=D.l1||'';document.getElementById('p').textContent=D.l2||'';
window.setT=t=>{const a=o3((t-.4)/.9);const d=document.getElementById('d');d.style.opacity=a;d.style.transform=`translateY(${(1-a)*24}px) scale(${1.04-0.04*a})`;
  document.getElementById('line').style.width=(980*o3((t-.9)/.9))+'px';
  const b=o3((t-1.3)/.8),p=document.getElementById('p');p.style.opacity=b;p.style.transform=`translateY(${(1-b)*16}px)`;
  document.body.style.opacity=1};
</script>
